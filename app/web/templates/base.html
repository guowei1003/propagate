<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page_title }} | Propagate</title>
    <link rel="stylesheet" href="/static/app.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body>
    <div class="scroll-progress" id="scroll-progress"></div>
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>
    <div class="ambient ambient-c"></div>
    <div class="app-shell">
      <header class="top-header" data-reveal>
        <a class="brand" href="/tasks">
          <span class="brand-mark">P</span>
          <span class="brand-text">Propagate</span>
        </a>
        <nav>
          <a href="/tasks" class="{{ 'is-active' if request.url.path.startswith('/tasks') else '' }}">任务中心</a>
          <a href="/env-profiles" class="{{ 'is-active' if request.url.path.startswith('/env-profiles') else '' }}">环境配置</a>
        </nav>
      </header>
      <main class="page-body">
        <header class="page-header" data-reveal>
          <p class="eyebrow">Propagate Workspace</p>
          <h1>{{ page_title }}</h1>
        </header>
        {% block content %}{% endblock %}
      </main>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
