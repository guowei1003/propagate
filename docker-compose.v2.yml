services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: propagate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ${PROPAGATE_DATA_ROOT:-/data/propagate}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d propagate"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/propagate
      LLM_PROVIDER_TYPE: ${LLM_PROVIDER_TYPE:-demo}
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-demo-heuristic}
      LLM_REVIEW_MODEL: ${LLM_REVIEW_MODEL:-}
      LLM_TEST_MODEL: ${LLM_TEST_MODEL:-}
      LLM_CAPABILITY_GENERATION_MODEL: ${LLM_CAPABILITY_GENERATION_MODEL:-}
      LLM_REPORT_MODEL: ${LLM_REPORT_MODEL:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ${PROPAGATE_DATA_ROOT:-/data/propagate}/app-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/propagate
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bash", "-lc", "./scripts/v2/apply_v2_migration.sh"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
