[project]
name = "propagate-agent-harness"
version = "0.1.0"
description = "Mission-driven multi-agent harness with supervision, approvals, and durable execution."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiosqlite>=0.21.0",
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.116.0",
    "greenlet>=3.2.0",
    "httpx>=0.28.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=2.1.0",
    "openai>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic-settings>=2.10.0",
    "pyyaml>=6.0.2",
    "sse-starlette>=3.0.0",
    "sqlalchemy>=2.0.40",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
    "asgi-lifespan>=2.1.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
    ".",
    "apps/api",
]
testpaths = [
    "apps/api/tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
