services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: propagate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - /data/propagate/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d propagate"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - propagate-net

  api:
    build:
      context: ${ROOT_DIR:-.}/backend
      dockerfile: ${ROOT_DIR:-.}/deploy/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/propagate
      LLM_PROVIDER: ${LLM_PROVIDER:-demo}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      DOCKER_NETWORK: propagate-net
      RUNNER_IMAGE: ${RUNNER_IMAGE:-propagate-runner:latest}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - propagate-net

  frontend:
    build:
      context: ${ROOT_DIR:-.}/frontend
      dockerfile: ${ROOT_DIR:-.}/deploy/docker/frontend.Dockerfile
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - "8888:80"
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - propagate-net

networks:
  propagate-net:
    driver: bridge
