services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-propagate}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ${PROPAGATE_POSTGRES_DIR:-/data/propagate/postgres}:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      PROPAGATE_DATABASE_URL: ${PROPAGATE_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-propagate}}
      PROPAGATE_DEFAULT_PROVIDER: ${PROPAGATE_DEFAULT_PROVIDER:-mock}
      PROPAGATE_DEFAULT_MODEL: ${PROPAGATE_DEFAULT_MODEL:-gpt-4.1-mini}
      PROPAGATE_OPENAI_API_KEY: ${PROPAGATE_OPENAI_API_KEY:-}
      PROPAGATE_OPENAI_BASE_URL: ${PROPAGATE_OPENAI_BASE_URL:-https://api.openai.com/v1}
      PROPAGATE_ARTIFACTS_DIR: ${PROPAGATE_ARTIFACTS_DIR:-/app/data/artifacts}
      PROPAGATE_WORKSPACES_DIR: ${PROPAGATE_WORKSPACES_DIR:-/app/data/workspaces}
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    volumes:
      - ${PROPAGATE_APP_DATA_DIR:-/data/propagate/app}:/app/data
      - ${PROPAGATE_CONFIG_DIR:-/data/propagate/config}:/app/config:ro

  web:
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
    depends_on:
      - api
    ports:
      - "3000:80"
